<svg width="1095" height="1556" xmlns="http://www.w3.org/2000/svg"><defs>
    <style>
      :root {
        --text-color: #222;
        --accent-color: #a00000;
        --line-color: #888;
        --bg-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-color: #e6e6e6;
          --accent-color: #ff6b6b;
          --line-color: #777;
          --bg-color: #222;
        }
      }
      .phase-title { font-size: 20px; font-weight: bold; text-anchor: middle; fill: var(--accent-color); }
      .moment-title { font-size: 18px; font-weight: bold; fill: var(--accent-color); }
      .utterance { font-size: 17.5px; font-style: italic; opacity: 0.85; }
      .timeline-bar { stroke: var(--line-color); stroke-width: 2; }
      .accent-dot { fill: var(--accent-color); stroke: var(--bg-color); stroke-width: 2; }
    </style>
    </defs><line x1="765" y1="100" x2="765" y2="1521" class="timeline-bar" /><line x1="400" y1="100" x2="400" y2="389" class="timeline-bar" /><line x1="35" y1="100" x2="35" y2="1083" class="timeline-bar" /><g font-family="Times New Roman" fill="var(--text-color)"><text x="185.0" y="50" class="phase-title">Phase 1: The 'Energy Ball'</text><circle cx="35" cy="100" r="5" class="accent-dot"/><text x="53" y="106"><tspan x="53" dy="0" class="moment-title">1. Action and Interpretation</tspan><tspan x="53" dy="22" class="utterance">'I did feel the heat from my</tspan><tspan x="53" dy="22" class="utterance">palms...'</tspan><tspan x="53" dy="22" class="utterance">'...as they rubbed up against each</tspan><tspan x="53" dy="22" class="utterance">other.'</tspan><tspan x="53" dy="22" class="utterance">'I think there was also like some</tspan><tspan x="53" dy="22" class="utterance">kind of glow on my hands.'</tspan><tspan x="53" dy="22" class="utterance">'...it felt like I was saving the</tspan><tspan x="53" dy="22" class="utterance">most sand.'</tspan></text><circle cx="35" cy="337" r="5" class="accent-dot"/><text x="53" y="343"><tspan x="53" dy="0" class="moment-title">2. Hands Apart</tspan><tspan x="53" dy="22" class="utterance">'I put my hands like six inches</tspan><tspan x="53" dy="22" class="utterance">apart...'</tspan><tspan x="53" dy="22" class="utterance">'I felt my hands want to cup a</tspan><tspan x="53" dy="22" class="utterance">little bit...'</tspan><tspan x="53" dy="22" class="utterance">'...so cup inwards.'</tspan></text><circle cx="35" cy="506" r="5" class="accent-dot"/><text x="53" y="512"><tspan x="53" dy="0" class="moment-title">3. Association and Memory</tspan><tspan x="53" dy="22" class="utterance">'...that kind of feeling that I get</tspan><tspan x="53" dy="22" class="utterance">when I'm going to bed...'</tspan><tspan x="53" dy="22" class="utterance">'...and I'm feeling some sort of</tspan><tspan x="53" dy="22" class="utterance">like invisible object.'</tspan></text><circle cx="35" cy="653" r="5" class="accent-dot"/><text x="53" y="659"><tspan x="53" dy="0" class="moment-title">4. Cognitive Formation</tspan><tspan x="53" dy="22" class="utterance">'So I kind of begun to feel the</tspan><tspan x="53" dy="22" class="utterance">shape of that...'</tspan><tspan x="53" dy="22" class="utterance">'...which was like spherical.'</tspan></text><circle cx="35" cy="778" r="5" class="accent-dot"/><text x="53" y="784"><tspan x="53" dy="0" class="moment-title">5. External Suggestion</tspan><tspan x="53" dy="22" class="utterance">'I think I'm starting to feel it a</tspan><tspan x="53" dy="22" class="utterance">little more.'</tspan><tspan x="53" dy="22" class="utterance">'And then you said something...'</tspan><tspan x="53" dy="22" class="utterance">'...that made it more recognizable,</tspan><tspan x="53" dy="22" class="utterance">I suppose.'</tspan></text><circle cx="35" cy="947" r="5" class="accent-dot"/><text x="53" y="953"><tspan x="53" dy="0" class="moment-title">6. Sensation Alteration</tspan><tspan x="53" dy="22" class="utterance">'...I put the right one on top of</tspan><tspan x="53" dy="22" class="utterance">the left one.'</tspan><tspan x="53" dy="22" class="utterance">'I could still kind of feel the</tspan><tspan x="53" dy="22" class="utterance">outline of the shape sphere...'</tspan><tspan x="53" dy="22" class="utterance">'...but I couldn't feel it as one</tspan><tspan x="53" dy="22" class="utterance">solid object.'</tspan></text><text x="550.0" y="50" class="phase-title">Phase 2: The 'Cupped Hands'</text><circle cx="400" cy="100" r="5" class="accent-dot"/><text x="418" y="106"><tspan x="418" dy="0" class="moment-title">7. Emotional State</tspan><tspan x="418" dy="22" class="utterance">'I think that was like excited</tspan><tspan x="418" dy="22" class="utterance">anticipation...'</tspan><tspan x="418" dy="22" class="utterance">'...to see what was gonna happen</tspan><tspan x="418" dy="22" class="utterance">next.'</tspan></text><circle cx="400" cy="247" r="5" class="accent-dot"/><text x="418" y="253"><tspan x="418" dy="0" class="moment-title">8. Pressure and Attentional</tspan><tspan x="418" dy="24" class="moment-title">Shift</tspan><tspan x="418" dy="22" class="utterance">'...you were pushing something</tspan><tspan x="418" dy="22" class="utterance">down.'</tspan><tspan x="418" dy="22" class="utterance">'I was slightly reminded of...the</tspan><tspan x="418" dy="22" class="utterance">sensation of smoke...'</tspan><tspan x="418" dy="22" class="utterance">'...I was so focused on the feeling</tspan><tspan x="418" dy="22" class="utterance">of my hands as their own hands.'</tspan><tspan x="418" dy="22" class="utterance">'...you pressing down, it didn't</tspan><tspan x="418" dy="22" class="utterance">feel any like pressure.'</tspan><tspan x="418" dy="22" class="utterance">'I wasn't really feeling anything.'</tspan></text><text x="915.0" y="50" class="phase-title">Phase 3: The Auditory Experience</text><circle cx="765" cy="100" r="5" class="accent-dot"/><text x="783" y="106"><tspan x="783" dy="0" class="moment-title">9. Setup</tspan><tspan x="783" dy="22" class="utterance">'...you talked me through it a</tspan><tspan x="783" dy="22" class="utterance">little bit.'</tspan><tspan x="783" dy="22" class="utterance">'...you compared it to a seashell.'</tspan><tspan x="783" dy="22" class="utterance">'So that was something that worked</tspan><tspan x="783" dy="22" class="utterance">very well with me for that.'</tspan></text><circle cx="765" cy="269" r="5" class="accent-dot"/><text x="783" y="275"><tspan x="783" dy="0" class="moment-title">10. Initial Auditory Sensation</tspan><tspan x="783" dy="22" class="utterance">'...what happened first is I could</tspan><tspan x="783" dy="22" class="utterance">hear the blood rushing in my ears.'</tspan></text><circle cx="765" cy="372" r="5" class="accent-dot"/><text x="783" y="378"><tspan x="783" dy="0" class="moment-title">11. Differentiating Sounds</tspan><tspan x="783" dy="22" class="utterance">'...it was hard to differentiate</tspan><tspan x="783" dy="22" class="utterance">from your air conditioner...'</tspan><tspan x="783" dy="22" class="utterance">'...but then I kind of felt like</tspan><tspan x="783" dy="22" class="utterance">there were two different sounds.'</tspan></text><circle cx="765" cy="527" r="5" class="accent-dot"/><text x="783" y="533"><tspan x="783" dy="0" class="moment-title">12. Deliberate Cognitive</tspan><tspan x="783" dy="24" class="moment-title">Generation</tspan><tspan x="783" dy="22" class="utterance">'...my brain started thinking of</tspan><tspan x="783" dy="22" class="utterance">phrases that I could hear.'</tspan><tspan x="783" dy="22" class="utterance">'Like I didn't actually hear any of</tspan><tspan x="783" dy="22" class="utterance">them...'</tspan><tspan x="783" dy="22" class="utterance">'I was thinking about. [Partners and</tspan><tspan x="783" dy="22" class="utterance">Roommates]'</tspan><tspan x="783" dy="22" class="utterance">'I thought about my cat meowing.'</tspan></text><circle cx="765" cy="776" r="5" class="accent-dot"/><text x="783" y="782"><tspan x="783" dy="0" class="moment-title">13. Vague Perception</tspan><tspan x="783" dy="22" class="utterance">'Then I started to like hear the</tspan><tspan x="783" dy="22" class="utterance">vibe of a phrase...'</tspan><tspan x="783" dy="22" class="utterance">'...as if it was far away and I</tspan><tspan x="783" dy="22" class="utterance">couldn't hear it.'</tspan><tspan x="783" dy="22" class="utterance">'I was like squinting, but with my</tspan><tspan x="783" dy="22" class="utterance">hearing...'</tspan></text><circle cx="765" cy="967" r="5" class="accent-dot"/><text x="783" y="973"><tspan x="783" dy="0" class="moment-title">14. Perceptual Crystallization</tspan><tspan x="783" dy="22" class="utterance">'And then, then I started to begin</tspan><tspan x="783" dy="22" class="utterance">to hear you say the word</tspan><tspan x="783" dy="22" class="utterance">seashell...'</tspan></text><circle cx="765" cy="1092" r="5" class="accent-dot"/><text x="783" y="1098"><tspan x="783" dy="0" class="moment-title">15. Phenomenological Analysis</tspan><tspan x="783" dy="22" class="utterance">'...that felt very much like two</tspan><tspan x="783" dy="22" class="utterance">different sounds to me.'</tspan><tspan x="783" dy="22" class="utterance">'...when I think something... it's</tspan><tspan x="783" dy="22" class="utterance">very close to me...'</tspan><tspan x="783" dy="22" class="utterance">'...versus when I was hearing</tspan><tspan x="783" dy="22" class="utterance">something in my hands...'</tspan><tspan x="783" dy="22" class="utterance">'...it felt very far away.'</tspan></text><circle cx="765" cy="1305" r="5" class="accent-dot"/><text x="783" y="1311"><tspan x="783" dy="0" class="moment-title">16. Cognitive Loop and Blurring</tspan><tspan x="783" dy="22" class="utterance">'And then as soon as I recognized</tspan><tspan x="783" dy="22" class="utterance">it, I thought it.'</tspan><tspan x="783" dy="22" class="utterance">'...then it got a little bit harder</tspan><tspan x="783" dy="22" class="utterance">to differentiate between the two.'</tspan></text><circle cx="765" cy="1452" r="5" class="accent-dot"/><text x="783" y="1458"><tspan x="783" dy="0" class="moment-title">17. Cessation</tspan><tspan x="783" dy="22" class="utterance">'I took my hands away from my</tspan><tspan x="783" dy="22" class="utterance">ears...'</tspan><tspan x="783" dy="22" class="utterance">'And then I stopped hearing stuff.'</tspan></text></g></svg>
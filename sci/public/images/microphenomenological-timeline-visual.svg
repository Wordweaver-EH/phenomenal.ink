<svg width="1070" height="1833" xmlns="http://www.w3.org/2000/svg"><defs>
    <style>
      :root {
        --text-color: #222;
        --accent-color: #a00000;
        --line-color: #888;
        --bg-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-color: #e6e6e6;
          --accent-color: #ff6b6b;
          --line-color: #777;
          --bg-color: #222;
        }
      }
      .phase-title { font-size: 20px; font-weight: bold; text-anchor: middle; fill: var(--accent-color); }
      .moment-title { font-size: 18px; font-weight: bold; fill: var(--accent-color); }
      .utterance { font-size: 17.5px; font-style: italic; opacity: 0.85; }
      .timeline-bar { stroke: var(--line-color); stroke-width: 2; }
      .accent-dot { fill: var(--accent-color); stroke: var(--bg-color); stroke-width: 2; }
    </style>
    </defs><line x1="765" y1="1304" x2="765" y2="1770" class="timeline-bar" /><line x1="400" y1="1304" x2="400" y2="1783" class="timeline-bar" /><line x1="35" y1="1304" x2="35" y2="1669" class="timeline-bar" /><line x1="765" y1="100" x2="765" y2="610" class="timeline-bar" /><line x1="400" y1="100" x2="400" y2="1069" class="timeline-bar" /><line x1="35" y1="100" x2="35" y2="645" class="timeline-bar" /><g font-family="Times New Roman" fill="var(--text-color)"><text x="185.0" y="50" class="phase-title">Phase 1: Induction and Afterimage</text><circle cx="35" cy="100" r="5" class="accent-dot"/><text x="53" y="106"><tspan x="53" dy="0" class="moment-title">1. Focusing on the Card</tspan><tspan x="53" dy="22" class="utterance">'I held the card.'</tspan><tspan x="53" dy="22" class="utterance">'I felt very focused on the little</tspan><tspan x="53" dy="22" class="utterance">question mark.'</tspan></text><circle cx="35" cy="201" r="5" class="accent-dot"/><text x="53" y="207"><tspan x="53" dy="0" class="moment-title">2. Hand Freezes</tspan><tspan x="53" dy="22" class="utterance">'I said the hand will now freeze in</tspan><tspan x="53" dy="22" class="utterance">place. And did it?'</tspan><tspan x="53" dy="22" class="utterance">'It did.'</tspan></text><circle cx="35" cy="302" r="5" class="accent-dot"/><text x="53" y="308"><tspan x="53" dy="0" class="moment-title">3. Visual Distortion</tspan><tspan x="53" dy="22" class="utterance">'...the other stuff was more sh-</tspan><tspan x="53" dy="22" class="utterance">shaky.'</tspan><tspan x="53" dy="22" class="utterance">'...the white of the shape was</tspan><tspan x="53" dy="22" class="utterance">fading into the gray of the</tspan><tspan x="53" dy="22" class="utterance">background.'</tspan></text><circle cx="35" cy="447" r="5" class="accent-dot"/><text x="53" y="453"><tspan x="53" dy="0" class="moment-title">4. Afterimage Formation</tspan><tspan x="53" dy="22" class="utterance">'...I remember beginning to see the</tspan><tspan x="53" dy="22" class="utterance">upper and lower lids of the</tspan><tspan x="53" dy="22" class="utterance">eyeball.'</tspan><tspan x="53" dy="22" class="utterance">'...it took maybe like two seconds</tspan><tspan x="53" dy="22" class="utterance">and then I could see the black</tspan><tspan x="53" dy="22" class="utterance">circle...'</tspan><tspan x="53" dy="22" class="utterance">'...that black circle that kind of</tspan><tspan x="53" dy="22" class="utterance">had a white outline.'</tspan><tspan x="53" dy="22" class="utterance">'It was so small.'</tspan></text><text x="550.0" y="50" class="phase-title">Phase 2: Spontaneous Generation</text><circle cx="400" cy="100" r="5" class="accent-dot"/><text x="418" y="106"><tspan x="418" dy="0" class="moment-title">5. Triangle Appears</tspan><tspan x="418" dy="22" class="utterance">'...then I saw a triangle... kind</tspan><tspan x="418" dy="22" class="utterance">of like the outline of a triangle.'</tspan><tspan x="418" dy="22" class="utterance">'And I was trying to face it up,</tspan><tspan x="418" dy="22" class="utterance">pointing up.'</tspan></text><circle cx="400" cy="223" r="5" class="accent-dot"/><text x="418" y="229"><tspan x="418" dy="0" class="moment-title">6. Flickering and Inverting</tspan><tspan x="418" dy="24" class="moment-title">Triangle</tspan><tspan x="418" dy="22" class="utterance">'I think it was more like</tspan><tspan x="418" dy="22" class="utterance">determination... to like keep</tspan><tspan x="418" dy="22" class="utterance">the...the shape there.'</tspan><tspan x="418" dy="22" class="utterance">'...things were like flickering in</tspan><tspan x="418" dy="22" class="utterance">and out of... existence...'</tspan><tspan x="418" dy="22" class="utterance">'...very quickly, I saw the</tspan><tspan x="418" dy="22" class="utterance">triangle pointing down instead.'</tspan><tspan x="418" dy="22" class="utterance">'And then it went back. It didn't</tspan><tspan x="418" dy="22" class="utterance">like flip...'</tspan></text><circle cx="400" cy="480" r="5" class="accent-dot"/><text x="418" y="486"><tspan x="418" dy="0" class="moment-title">7. 'Lava Lamp' Colors</tspan><tspan x="418" dy="22" class="utterance">'...I remember seeing red and</tspan><tspan x="418" dy="22" class="utterance">pink.'</tspan><tspan x="418" dy="22" class="utterance">'...the colors were kind of doing a</tspan><tspan x="418" dy="22" class="utterance">lava lamp sort of thing...'</tspan></text><circle cx="400" cy="603" r="5" class="accent-dot"/><text x="418" y="609"><tspan x="418" dy="0" class="moment-title">8. Guided Morph: Leaf</tspan><tspan x="418" dy="22" class="utterance">'I was seeing a lot of like kind of</tspan><tspan x="418" dy="22" class="utterance">curvy lines.'</tspan><tspan x="418" dy="22" class="utterance">'Oh, a leaf... Yes, we turned one</tspan><tspan x="418" dy="22" class="utterance">of the curvy lines into the side of</tspan><tspan x="418" dy="22" class="utterance">a leaf.'</tspan><tspan x="418" dy="22" class="utterance">'...and then I think I saw the</tspan><tspan x="418" dy="22" class="utterance">veins of the leaf.'</tspan></text><circle cx="400" cy="792" r="5" class="accent-dot"/><text x="418" y="798"><tspan x="418" dy="0" class="moment-title">9. Guided Morph: Ship's Mast</tspan><tspan x="418" dy="22" class="utterance">'I saw the ship's mast... one long</tspan><tspan x="418" dy="22" class="utterance">horizontal line and then I saw...</tspan><tspan x="418" dy="22" class="utterance">ropes...'</tspan><tspan x="418" dy="22" class="utterance">'I did not see the bottom of the</tspan><tspan x="418" dy="22" class="utterance">ship or the sides of the ship.'</tspan></text><circle cx="400" cy="937" r="5" class="accent-dot"/><text x="418" y="943"><tspan x="418" dy="0" class="moment-title">10. Guided Morph: Stairs</tspan><tspan x="418" dy="22" class="utterance">'Um, yes, I saw a zigzag... an</tspan><tspan x="418" dy="22" class="utterance">acute, acute angles.'</tspan><tspan x="418" dy="22" class="utterance">'You asked me if I could make it</tspan><tspan x="418" dy="22" class="utterance">into stairs. Which I could.'</tspan><tspan x="418" dy="22" class="utterance">'...it became kind of like thick</tspan><tspan x="418" dy="22" class="utterance">stairs... I, I found that. Yeah.'</tspan></text><text x="915.0" y="50" class="phase-title">Phase 3: Environmental Changes</text><circle cx="765" cy="100" r="5" class="accent-dot"/><text x="783" y="106"><tspan x="783" dy="0" class="moment-title">11. Lights Off</tspan><tspan x="783" dy="22" class="utterance">'Yes, which was helpful, I think...</tspan><tspan x="783" dy="22" class="utterance">the background color got darker.'</tspan><tspan x="783" dy="22" class="utterance">'They became a bit more clear...</tspan><tspan x="783" dy="22" class="utterance">more vivid...'</tspan></text><circle cx="765" cy="223" r="5" class="accent-dot"/><text x="783" y="229"><tspan x="783" dy="0" class="moment-title">12. Moving Blindly</tspan><tspan x="783" dy="22" class="utterance">'It was very uncentering... I</tspan><tspan x="783" dy="22" class="utterance">didn't really know how big my steps</tspan><tspan x="783" dy="22" class="utterance">were.'</tspan><tspan x="783" dy="22" class="utterance">'...seeing the same things like...</tspan><tspan x="783" dy="22" class="utterance">the splotches and... the wavy</tspan><tspan x="783" dy="22" class="utterance">line...'</tspan></text><circle cx="765" cy="390" r="5" class="accent-dot"/><text x="783" y="396"><tspan x="783" dy="0" class="moment-title">13. Eyes Open in Pillowcase</tspan><tspan x="783" dy="22" class="utterance">'Yes, it didn't change my vision at</tspan><tspan x="783" dy="22" class="utterance">all.'</tspan><tspan x="783" dy="22" class="utterance">'...when I opened my eyes... it was</tspan><tspan x="783" dy="22" class="utterance">the exact same color as my eyes</tspan><tspan x="783" dy="22" class="utterance">being closed.'</tspan><tspan x="783" dy="22" class="utterance">'...I was kind of forgetting if my</tspan><tspan x="783" dy="22" class="utterance">eyes were open or not...'</tspan><tspan x="783" dy="22" class="utterance">'I saw... angry human eyes. And I</tspan><tspan x="783" dy="22" class="utterance">saw this weird little mouse</tspan><tspan x="783" dy="22" class="utterance">creature.'</tspan></text><text x="185.0" y="1254" class="phase-title">Phase 4: Eyes Open - Reality Overlay</text><circle cx="35" cy="1304" r="5" class="accent-dot"/><text x="53" y="1310"><tspan x="53" dy="0" class="moment-title">14. Looking at the Wall</tspan><tspan x="53" dy="22" class="utterance">'...the wall itself still kind of</tspan><tspan x="53" dy="22" class="utterance">looked like my closed eyes.'</tspan><tspan x="53" dy="22" class="utterance">'I saw things that were on the way</tspan><tspan x="53" dy="22" class="utterance">through the wall.'</tspan><tspan x="53" dy="22" class="utterance">'...it felt like things were kind</tspan><tspan x="53" dy="22" class="utterance">of moving towards or away from me.'</tspan><tspan x="53" dy="22" class="utterance">'...little tiny particles that were</tspan><tspan x="53" dy="22" class="utterance">moving... which I was describing as</tspan><tspan x="53" dy="22" class="utterance">snow.'</tspan></text><circle cx="35" cy="1537" r="5" class="accent-dot"/><text x="53" y="1543"><tspan x="53" dy="0" class="moment-title">15. Integrated Imagery</tspan><tspan x="53" dy="22" class="utterance">'...I started to see more teeth...</tspan><tspan x="53" dy="22" class="utterance">like human looking teeth... not</tspan><tspan x="53" dy="22" class="utterance">necessarily scary.'</tspan><tspan x="53" dy="22" class="utterance">'The mathematical insects, it felt</tspan><tspan x="53" dy="22" class="utterance">like I saw... angles that were...</tspan><tspan x="53" dy="22" class="utterance">wiggling...'</tspan></text><text x="550.0" y="1254" class="phase-title">Phase 5: Negative Hallucination</text><circle cx="400" cy="1304" r="5" class="accent-dot"/><text x="418" y="1310"><tspan x="418" dy="0" class="moment-title">16. Mindset: 'Not Essential'</tspan><tspan x="418" dy="22" class="utterance">'...looking at you was not</tspan><tspan x="418" dy="22" class="utterance">important or not essential.'</tspan></text><circle cx="400" cy="1383" r="5" class="accent-dot"/><text x="418" y="1389"><tspan x="418" dy="0" class="moment-title">17. Eyes Open: Visual Absence</tspan><tspan x="418" dy="22" class="utterance">'My eyes were... very unfocused...</tspan><tspan x="418" dy="22" class="utterance">I really just saw the darkness of</tspan><tspan x="418" dy="22" class="utterance">the closet...'</tspan><tspan x="418" dy="22" class="utterance">'And I could not see you. Right.</tspan><tspan x="418" dy="22" class="utterance">And that was kind of wild.'</tspan></text><circle cx="400" cy="1528" r="5" class="accent-dot"/><text x="418" y="1534"><tspan x="418" dy="0" class="moment-title">18. Shadow Precedes Form</tspan><tspan x="418" dy="22" class="utterance">'...I saw your shadow before I saw</tspan><tspan x="418" dy="22" class="utterance">you.'</tspan><tspan x="418" dy="22" class="utterance">'I think I definitely saw as a</tspan><tspan x="418" dy="22" class="utterance">human form... on the wall itself.'</tspan></text><circle cx="400" cy="1651" r="5" class="accent-dot"/><text x="418" y="1657"><tspan x="418" dy="0" class="moment-title">19. Flickering Re-emergence</tspan><tspan x="418" dy="22" class="utterance">'Um, it was kind of like the, like</tspan><tspan x="418" dy="22" class="utterance">the flicker I was talking about.'</tspan><tspan x="418" dy="22" class="utterance">'...it was very fast.'</tspan><tspan x="418" dy="22" class="utterance">'...like you weren't there and then</tspan><tspan x="418" dy="22" class="utterance">it was like, when you came in, you</tspan><tspan x="418" dy="22" class="utterance">were there.'</tspan></text><text x="915.0" y="1254" class="phase-title">Phase 6: Anchored Projection</text><circle cx="765" cy="1304" r="5" class="accent-dot"/><text x="783" y="1310"><tspan x="783" dy="0" class="moment-title">20. Conjured Crescent Moon</tspan><tspan x="783" dy="22" class="utterance">'I saw a crescent moon shape...</tspan><tspan x="783" dy="22" class="utterance">like white or yellow like.'</tspan><tspan x="783" dy="22" class="utterance">'You were holding it... upright...</tspan><tspan x="783" dy="22" class="utterance">the size of a soccer ball.'</tspan><tspan x="783" dy="22" class="utterance">'It was spiky... the shape was a</tspan><tspan x="783" dy="22" class="utterance">little bit flickering... It felt</tspan><tspan x="783" dy="22" class="utterance">pretty 3D.'</tspan><tspan x="783" dy="22" class="utterance">'...I almost saw the outline of a</tspan><tspan x="783" dy="22" class="utterance">nose on the moon...'</tspan></text><circle cx="765" cy="1537" r="5" class="accent-dot"/><text x="783" y="1543"><tspan x="783" dy="0" class="moment-title">21. Anchored Red Ball</tspan><tspan x="783" dy="22" class="utterance">'Yeah, the red ball.'</tspan><tspan x="783" dy="22" class="utterance">'I see a circle and it's right</tspan><tspan x="783" dy="22" class="utterance">where you touched it.'</tspan><tspan x="783" dy="22" class="utterance">'...the circle felt a little bit</tspan><tspan x="783" dy="22" class="utterance">bigger than it should have been.'</tspan><tspan x="783" dy="22" class="utterance">'...it was probably like, like a</tspan><tspan x="783" dy="22" class="utterance">CD.'</tspan></text><circle cx="765" cy="1726" r="5" class="accent-dot"/><text x="783" y="1732"><tspan x="783" dy="0" class="moment-title">22. Conclusion</tspan><tspan x="783" dy="22" class="utterance">'I think that was it...'</tspan><tspan x="783" dy="22" class="utterance">'That was fucking wild.'</tspan></text></g></svg>